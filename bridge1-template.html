<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridge 1 designer</title><style>
:root{color-scheme:dark;font:13px system-ui,sans-serif;color:#dddddd;background:#080808}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;grid-template-rows:minmax(0,1fr) auto;background:#080808}
button,input,select{font:inherit;color:inherit;background:#242424;border:1px solid #3b3b3b;border-radius:5px}button{cursor:pointer;min-height:34px;padding:6px 11px}button:hover{background:#2e2e2e}button[aria-pressed=true]{background:#bcbcbc;color:#181818;border-color:#bcbcbc}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid #cecece;outline-offset:2px}[hidden]{display:none!important}
/* Settings panel: one part of the bridge at a time. */
main{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:0}aside{display:flex;flex-direction:column;gap:12px;padding:12px;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#444444 transparent;border-right:1px solid #2e2e2e;background:#141414}aside section{display:flex;flex-direction:column;gap:12px}
.segmented{display:flex;gap:2px;padding:2px;border:1px solid #333333;border-radius:6px;background:#0d0d0d}.segmented button{flex:1;border:0;background:transparent;min-height:32px;padding:5px 8px}.segmented button[aria-pressed=true]{background:#bcbcbc;color:#181818}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#c5c5c5}select{width:100%;min-height:34px;padding:6px 8px;background:#222222;border:1px solid #3b3b3b;border-radius:5px}
.control-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:#c5c5c5}.control-head input,.inline input,.pair input{width:68px;min-height:32px;padding:5px 7px;font-variant-numeric:tabular-nums}.control input[type=range]{width:100%;margin:7px 0 0;min-height:22px;padding:0;border:0;background:transparent;accent-color:#bbbbbb}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.inline{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:#c5c5c5}.check{display:flex;align-items:center;gap:8px;font-size:12px;color:#cfcfcf;min-height:30px}.check input{width:16px;height:16px;margin:0;accent-color:#aaaaaa}.split{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 68px 68px;align-items:center;gap:6px;font-size:12px;color:#c5c5c5}.pair.head{font-size:11px;color:#8d8d8d}.pair.head span:not(:first-child){text-align:center}
.divider{border-top:1px solid #2a2a2a;margin:0}
/* Canvas panel, as in the Curves tab. */
.canvas-panel{display:grid;grid-template-rows:auto minmax(0,1fr) 26px;min-width:0;min-height:0}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #2e2e2e;background:#141414}.view-switch{display:flex;gap:2px;padding:2px;border:1px solid #333333;border-radius:6px;background:#0d0d0d}.view-switch button{border:0;background:transparent;min-height:30px;min-width:40px;padding:4px 10px}.view-switch button[aria-pressed=true]{background:#bcbcbc;color:#181818}
#depth-control{display:flex;align-items:center;gap:7px;font-size:11px;color:#aaaaaa}#depth{width:56px;min-height:32px;padding:4px 6px}#camera-controls{display:flex;gap:5px}#view-title{color:#aaaaaa;font-size:11px;margin-right:auto}.mode3d #view-title{display:none}.mode3d #camera-controls{margin-right:auto}.zoom{display:flex;gap:5px}.zoom button{min-width:38px}#open-controls{display:none}
.display-settings{position:relative}.display-settings summary{display:flex;align-items:center;gap:8px;min-height:34px;padding:5px 10px;border:1px solid #3b3b3b;border-radius:5px;background:#242424;font-size:12px;cursor:pointer;list-style:none}.display-settings summary::-webkit-details-marker{display:none}.display-settings summary::after{content:"";width:5px;height:5px;border-right:1.5px solid #9a9a9a;border-bottom:1.5px solid #9a9a9a;transform:rotate(45deg);margin:-3px 0 0 2px}.display-settings[open] summary{background:#303030;border-color:#6a6a6a}.display-settings[open] summary::after{transform:rotate(-135deg);margin-top:3px}.display-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:220px;display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;background:#181818;border:1px solid #444444;border-radius:6px;box-shadow:0 12px 32px #000000aa}.display-menu #mono{margin-top:8px}
#viewport{position:relative;min-height:0;overflow:hidden;background:#080808}#preview,#preview3d{position:absolute;width:100%;height:100%;touch-action:none;cursor:grab}#preview:active,#preview3d:active{cursor:grabbing}.tile{cursor:pointer}.tile:hover,.tile.selected{filter:brightness(1.2)}.handle{cursor:grab;touch-action:none}
#busy{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#2f2f2fed;border:1px solid #545454;color:#dedede;border-radius:10px;padding:7px 14px;font-size:11px;pointer-events:none;white-space:nowrap}#drag-hint{position:absolute;bottom:12px;left:14px;font-size:10px;color:#939393;pointer-events:none}
.canvas-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 14px;border-top:1px solid #2e2e2e;font-size:10px;color:#a5a5a5;background:#080808}#selected{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 14px;border-top:1px solid #2e2e2e;background:#141414;font-size:11px;color:#b5b5b5}.counts{display:flex;gap:18px;flex-wrap:wrap}.counts span{display:flex;align-items:center;gap:6px}.counts b{color:#eaeaea;font-weight:600;font-variant-numeric:tabular-nums}.swatch{display:inline-block;width:9px;height:9px;border-radius:3px}.mono .swatch{display:none}.actions{display:flex;gap:6px}#export{background:#bcbcbc;color:#171717;border-color:#bcbcbc}
#close-controls,#sheet-shade{display:none}
@media(pointer:coarse){button{min-height:44px}input[type=number],select{min-height:44px;font-size:16px}.control input[type=range]{min-height:30px}}
@media(max-width:760px){main{display:block;position:relative}.canvas-panel{height:100%}aside{display:none;position:absolute;left:0;right:0;bottom:0;z-index:4;max-height:88%;border:1px solid #4a4a4a;border-radius:10px 10px 0 0;padding:12px}.editing aside{display:flex}.editing #sheet-shade{display:block;position:absolute;inset:0;z-index:3;background:#00000099;border:0;border-radius:0}#close-controls{display:block;align-self:flex-end;min-height:38px}#open-controls{display:block}#view-title,#drag-hint{display:none}.mode3d #camera-controls{order:5;flex-basis:100%;margin:0}.mode3d #camera-controls button{flex:1}.display-menu{right:auto;left:0}footer{flex-wrap:wrap}.counts{gap:12px}}
</style></head><body>
<main><button id="sheet-shade" aria-label="Close settings"></button><aside id="controls" aria-label="Bridge 1 settings"><button id="close-controls">Done</button>
<div class="segmented" role="group" aria-label="Bridge part"><button id="part-lower" aria-pressed="true" title="Lower curve">Lower</button><button id="part-beams" aria-pressed="false" title="Side beams">Beams</button><button id="part-upper" aria-pressed="false" title="Upper curve">Upper</button></div>
<section id="lower-panel"><label class="field">Curve<select id="lower-type"><option value="circle">Circular arc</option><option value="ellipse">Elliptical arc</option><option value="custom">Custom curve</option></select></label><div id="lower-controls"></div><div class="row"><button id="lower-extra">Add point</button><button id="lower-lock" aria-pressed="false" title="Lock the middle point to the centre line">Lock centre</button></div><label class="inline">Thickness<input id="lower-thickness" type="number" min="1" max="6" step=".5" value="2" title="Vertical separation of the outside and inside reference curves, in blocks"></label></section>
<section id="beams-panel" hidden><label class="check"><input id="beams-linked" type="checkbox" checked> Same on both sides</label><div id="beam-controls"></div></section>
<section id="upper-panel" hidden><label class="field">Curve<select id="upper-type"><option value="circle">Circular arc</option><option value="ellipse">Elliptical arc</option><option value="custom">Custom curve</option></select></label><div id="upper-controls"></div><div class="row"><button id="upper-extra">Add point</button><button id="upper-lock" aria-pressed="false" title="Lock the middle point to the centre line">Lock centre</button></div><label class="inline">Thickness<input id="upper-thickness" type="number" min="1" max="6" step=".5" value="2" title="Vertical separation of the outside and inside reference curves, in blocks"></label><label class="inline">Height<input id="upper-level" type="number" min="-256" max="256" step="1" value="30" title="Height of the upper curve's ends"></label><hr class="divider"><div class="split"><label class="check" title="Upside down, as a mirror image of an arch"><input id="upper-mirrored" type="checkbox" checked> Mirrored</label><button id="upper-mirror" title="Replace the upper curve with a mirror image of the lower curve">Mirror lower</button></div></section>
</aside>
<section class="canvas-panel"><div class="toolbar"><div class="view-switch"><button id="view-2d" aria-pressed="true">2D</button><button id="view-3d" aria-pressed="false">3D</button></div><label id="depth-control" hidden>Depth <input id="depth" type="number" min="1" max="32" value="12"></label><div id="camera-controls" hidden><button id="outside">Outside</button><button id="inside">Inside</button><button id="top">Top</button></div><span id="view-title">Bridge elevation</span><button id="open-controls" aria-controls="controls">Settings</button><details class="display-settings"><summary title="Display &amp; accuracy">Display</summary><div class="display-menu"><label class="check"><input id="reference" type="checkbox" checked> Reference curves</label><label class="check"><input id="grid" type="checkbox" checked> Grid</label><label class="check"><input id="handles" type="checkbox" checked> Curve handles</label><label class="check"><input id="baseline" type="checkbox"> Full blocks only</label><button id="mono" aria-pressed="false">Single colour</button></div></details><div class="zoom"><button id="minus" aria-label="Zoom out">−</button><button id="fit">Fit</button><button id="plus" aria-label="Zoom in">+</button></div></div>
<div id="viewport"><svg id="preview" aria-label="Bridge elevation with editable lower and upper curves"></svg><canvas id="preview3d" hidden tabindex="0" aria-label="Interactive 3D bridge. Drag to orbit, shift-drag to pan, scroll to zoom. Arrow keys rotate."></canvas><div id="busy" role="status" hidden>Finding the best fit…</div><div id="drag-hint">Drag handles to shape · Drag grid to pan</div></div><div class="canvas-footer"><span id="selected">1 square = 1 block</span><span id="dimensions"></span></div></section></main>
<footer><div class="counts"><span><i class="swatch" style="background:#b0b0b0"></i><b id="blocks">—</b> blocks</span><span><i class="swatch" style="background:#818181"></i><b id="stairs">—</b> stairs</span><span><i class="swatch" style="background:#bababa"></i><b id="slabs">—</b> slabs</span><span><i class="swatch" style="background:#dedede"></i><b id="beam-count">—</b> in beams</span></div><div class="actions"><button id="reset" title="Reset Bridge 1 to the defaults">Reset</button><button id="export" disabled title="Download every block as a CSV list">CSV ↓</button></div></footer>
<script type="module" src="bridge1-app.js"></script></body></html>
