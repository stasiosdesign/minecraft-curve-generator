<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridge 1 designer</title><style>

#viewport{position:relative;min-height:0;overflow:hidden;background:#080808}#preview,#preview3d{position:absolute;width:100%;height:100%;touch-action:none;cursor:grab}#preview:active,#preview3d:active{cursor:grabbing}.tile{cursor:pointer}.tile:hover,.tile.selected{filter:brightness(1.2)}.handle{cursor:grab;touch-action:none}

<script>(()=>{
// Occupied half-cell masks, bottom row first. No sideways slabs or wedges.
const shapes={block:[1,1,1,1],slab:[1,1,0,0],right:[1,1,0,1],left:[1,1,1,0]};
function polygon(e){const {x,y,type,flip}=e;let pts=type==='block'?[[0,0],[1,0],[1,1],[0,1]]:type==='slab'?[[0,0],[1,0],[1,.5],[0,.5]]:type==='right'?[[0,0],[1,0],[1,1],[.5,1],[.5,.5],[0,.5]]:[[0,0],[1,0],[1,.5],[.5,.5],[.5,1],[0,1]];return pts.map(([a,b])=>[x+a,y+(flip?1-b:b)]);}
function elements(columns,ceiling,flip){const out=[];columns.forEach((c,x)=>{for(let y=0;y<c.base;y++)out.push({x,y,type:'block'});if(c.type!=='empty')out.push({x,y:c.base,type:c.type});});return out.map(e=>flip?{...e,y:ceiling-1-e.y,flip:true}:e);}

function curve(p){
 let w=p.width,h=p.height,fn,bend=.5;const base=4;
 if(p.type==='circle'){const a=p.extent*Math.PI/360,r=p.radius;w=2*r*Math.sin(a);h=r*(1-Math.cos(a));fn=x=>base+Math.sqrt(Math.max(0,r*r-(x-w/2)**2))-r*Math.cos(a);}
 else if(p.type==='ellipse')fn=x=>base+h*Math.sqrt(Math.max(0,1-(2*x/w-1)**2));
 else {bend=Math.max(.1,Math.min(.9,(p.bend??50)/100));const left=p.left??4,right=p.right??4,middle=p.middle??16,control=2*middle-(left+right)/2;fn=x=>{const u=x/w;
 // Monotone parameter mapping moves the bend without loops or a tangent seam.
 const t=(1-bend)*u/(bend+(1-2*bend)*u);return (1-t)**2*left+2*(1-t)*t*control+t*t*right;};}
 // Centre symmetric references on a valid grid reflection axis without changing their shape.
 const symmetric=!p.extraEnabled&&(p.type!=='custom'||(Math.abs((p.left??4)-(p.right??4))<1e-9&&Math.abs(bend-.5)<1e-9));
 const span=w,gridWidth=symmetric?(p.layout==='diagonal'?(Math.max(1,Math.ceil(w*Math.SQRT2-1e-9)-1)+1)/Math.SQRT2:Math.ceil(w-1e-9)):w,offset=(gridWidth-span)/2,raw=fn;
 fn=x=>raw(Math.max(0,Math.min(span,x-offset)));
 let extraX=null;
 if(p.type==='custom'&&p.extraEnabled){
  extraX=Math.max(.05,Math.min(.95,(p.extraPosition??75)/100));if(Math.abs(extraX-bend)<.025)extraX=bend+(extraX<bend?-.025:.025);
  const nodes=[[0,p.left??4],[w*bend,p.middle??16],[w*extraX,p.extraHeight??12],[w,p.right??4]].sort((a,b)=>a[0]-b[0]);
  const slopes=nodes.slice(1).map((n,i)=>(n[1]-nodes[i][1])/(n[0]-nodes[i][0]));
  const tangents=nodes.map((n,i)=>{if(i===0)return slopes[0];if(i===nodes.length-1)return slopes.at(-1);if(slopes[i-1]*slopes[i]<=0)return 0;const a=nodes[i][0]-nodes[i-1][0],b=nodes[i+1][0]-nodes[i][0],u=2*b+a,v=b+2*a;return (u+v)/(u/slopes[i-1]+v/slopes[i]);});
  fn=x=>{const u=Math.max(0,Math.min(w,x-offset));let i=0;while(i<nodes.length-2&&u>nodes[i+1][0])i++;const [a,ya]=nodes[i],[b,yb]=nodes[i+1],d=b-a,t=(u-a)/d;return (2*t**3-3*t*t+1)*ya+(t**3-2*t*t+t)*d*tangents[i]+(-2*t**3+3*t*t)*yb+(t**3-t*t)*d*tangents[i+1];};
 }
 const thickness=p.thickness??2,points=Array.from({length:513},(_,i)=>[offset+span*i/512,fn(offset+span*i/512)]),inner=points.map(([x,y])=>[x,y-thickness]);
 return {w:gridWidth,span,offset,symmetric,h:Math.max(...points.map(a=>a[1])),min:Math.min(...inner.map(a=>a[1])),fn,points,inner,thickness,handles:[[offset,fn(offset)],[offset+span*bend,fn(offset+span*bend)],[offset+span,fn(offset+span)],...(extraX===null?[]:[[offset+span*extraX,fn(offset+span*extraX)]])]};
}

// Nearest-polyline distance with a bounding-volume tree.
function tree(pts,lo=0,hi=pts.length-1){const slice=pts.slice(lo,hi+1),node={minX:Math.min(...slice.map(p=>p[0])),maxX:Math.max(...slice.map(p=>p[0])),minY:Math.min(...slice.map(p=>p[1])),maxY:Math.max(...slice.map(p=>p[1]))};if(hi-lo<=4)node.points=slice;else{const mid=(lo+hi)>>1;node.left=tree(pts,lo,mid);node.right=tree(pts,mid,hi);}return node;}
function distance(x,y,root){let best=Infinity;const bound=n=>Math.max(n.minX-x,0,x-n.maxX)**2+Math.max(n.minY-y,0,y-n.maxY)**2;function visit(n){if(bound(n)>=best)return;if(n.points){for(let i=1;i<n.points.length;i++){const [a,b]=n.points[i-1],[c,d]=n.points[i],dx=c-a,dy=d-b,t=Math.max(0,Math.min(1,((x-a)*dx+(y-b)*dy)/(dx*dx+dy*dy)));best=Math.min(best,(x-a-t*dx)**2+(y-b-t*dy)**2);}}else if(bound(n.left)<bound(n.right)){visit(n.left);visit(n.right);}else{visit(n.right);visit(n.left);}}visit(root);return best;}
// Bit masks: lower left, lower right, upper left, upper right.
const legal=new Map([[15,{type:'block'}],[3,{type:'slab'}],[12,{type:'slab',flip:true}],[11,{type:'right'}],[7,{type:'left'}],[14,{type:'right',flip:true}],[13,{type:'left',flip:true}]]);
function columnTiles(x,low,high,onlyBlocks){
 if(Math.min(...high)-Math.max(...low)<.5)return null;
 const out=[];
 for(let y=Math.floor(Math.min(...low));y<Math.ceil(Math.max(...high));y++){
  let mask=0;for(let j=0;j<4;j++){const yy=y+(j<2?.25:.75),side=j%2;if(yy>low[side]&&yy<high[side])mask|=1<<j;}
  if(!mask)continue;const shape=legal.get(mask);if(!shape||(onlyBlocks&&mask!==15))return null;out.push({x,y,...shape});
 }return out;
}
function profiles(min,max,upper,onlyBlocks){const out=[];for(let y=Math.floor(min)-1;y<=Math.ceil(max)+1;y++){out.push([y,y]);if(!onlyBlocks)out.push([y+.5,y+.5],upper?[y+.5,y+1]:[y+.5,y],upper?[y+1,y+.5]:[y,y+.5]);}return out;}
function measurePlacedRoof(blocks,c,layout){
 const top=tree(c.points),bottom=tree(c.inner),surfaces=new Map();
 for(const e of blocks){const mask=e.type==='block'?[1,1,1,1]:e.type==='slab'?[1,1,0,0]:e.type==='right'?[1,1,0,1]:[1,1,1,0];for(let x=0;x<2;x++)for(let z=0;z<2;z++)for(let y=0;y<2;y++){const side=e.axis==='z'?z:x;if(!mask[(e.flip?1-y:y)*2+side])continue;const xx=e.x+(x+.5)/2,zz=e.z+(z+.5)/2,key=xx+','+zz,low=e.y+y/2,high=low+.5,s=surfaces.get(key);if(s){s.low=Math.min(s.low,low);s.high=Math.max(s.high,high);}else surfaces.set(key,{x:xx,z:zz,low,high});}}
 let outer=0,inner=0;for(const s of surfaces.values()){const u=layout==='diagonal'?(s.x+s.z)/Math.SQRT2:layout==='hip'?Math.min(s.x,s.z):s.x;outer+=distance(u,s.high,top);inner+=distance(u,s.low,bottom);}return {outerRms:Math.sqrt(outer/surfaces.size),innerRms:Math.sqrt(inner/surfaces.size)};
}
function solve(c,{onlyBlocks=false,diagonal=false,startThickness=null,maxThickness=null,startLow=null,allowGaps=false}={}){
 const outer=tree(c.points),inner=tree(c.inner),layers=[],n=diagonal?Math.max(1,Math.ceil(c.w*Math.SQRT2-1e-9)-1):Math.ceil(c.w-1e-9),thickness=c.thickness;
 const at=t=>c.fn(Math.max(0,Math.min(c.w,t)));
 const centre=diagonal?(n+1)/(2*Math.SQRT2):n/2;
 const symmetric=startThickness===null&&startLow===null&&Math.abs(centre-c.w/2)<1e-7&&c.points.every(([x,y],i)=>Math.abs(y-c.points[c.points.length-1-i][1])<1e-7);
 const count=symmetric?Math.ceil(n/2):n;
 for(let x=0;x<count;x++){
  const ys=[0,.25,.5,.75,1].map(t=>at(diagonal?(x+2*t)/Math.SQRT2:x+t)),min=Math.min(...ys),max=Math.max(...ys),top=profiles(min,max,true,onlyBlocks),bottom=profiles(min-thickness,max-thickness,false,onlyBlocks),opts=[];
  if(x===0&&startThickness!==null){top.push([startThickness,startThickness]);bottom.push([0,0]);}
  if(x===0&&startLow!==null){top.push([startLow+thickness,startLow+thickness]);bottom.push([startLow,startLow]);}
  const riserCache=new Map();
  function edgeError(a,b,xx,ref){const len=Math.abs(b-a);if(!len)return 0;const lo=Math.min(a,b),key=[lo,lo+len,xx,ref===outer?0:1].join(',');if(riserCache.has(key))return riserCache.get(key);const count=Math.max(1,Math.ceil(len*4));let cost=0;for(let j=0;j<count;j++)cost+=distance(xx,lo+len*(j+.5)/count,ref)*len/count;riserCache.set(key,cost);return cost;}
  function surface(profile,ref){let e=0;for(let j=0;j<8;j++){if(diagonal){for(let z=0;z<4;z++)e+=distance((x+(j+.5)/8+(z+.5)/4)/Math.SQRT2,profile[j<4?0:1],ref)/32;}else e+=distance(x+(j+.5)/8,profile[j<4?0:1],ref)/8;}if(diagonal){for(let z=0;z<4;z++)e+=edgeError(profile[0],profile[1],(x+.5+(z+.5)/4)/Math.SQRT2,ref)/4;return e;}return e+edgeError(profile[0],profile[1],x+.5,ref);}
  const tc=new Map(top.map(a=>[a,surface(a,outer)])),bc=new Map(bottom.map(a=>[a,surface(a,inner)]));
  for(const high of top)for(const low of bottom){if(maxThickness!==null&&Math.max(...high)-Math.min(...low)>maxThickness+1e-9)continue;if(x===0&&startLow!==null&&low[0]!==startLow)continue;if(x===0&&startThickness!==null&&(low.some(y=>y!==0)||high.some(y=>y!==startThickness)))continue;if(symmetric&&n%2&&x===count-1&&(high[0]!==high[1]||low[0]!==low[1]))continue;const tiles=columnTiles(x,low,high,onlyBlocks);if(!tiles)continue;const thick=(high[0]+high[1]-low[0]-low[1])/2;const unary=tc.get(high)+bc.get(low)+.008*(thick-thickness)**2+.0002*tiles.filter(t=>t.type!=='block').length;opts.push({high,low,tiles,unary:symmetric&&n%2&&x===count-1?unary/2:unary,cost:Infinity,prev:-1});}
  // DP is exact within these retained states, not over all possible builds.
  opts.sort((a,b)=>a.unary-b.unary);const kept=opts.slice(0,72);
  const bridge=opts.find(o=>Math.max(...o.low)<=Math.floor(min-thickness)&&Math.min(...o.high)>=Math.ceil(max));
  if(bridge&&!kept.includes(bridge))kept.push(bridge);
  const edgeCache=new Map();
  for(const o of kept){if(!x){o.cost=o.unary;continue;}for(let k=0;k<layers[x-1].length;k++){

document.addEventListener('pointerdown',e=>{const menu=$('.display-settings');if(menu.open&&!menu.contains(e.target))menu.open=false;});
// ---- 2D interaction (as in the Curves tab) ----
const svg=$('#preview'),world=e=>new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());
svg.onpointerdown=e=>{if(e.button!==0)return;const h=e.target.closest('[data-handle]'),name=h?.dataset.curve??null;
 drag={x:e.clientX,y:e.clientY,point:world(e),pan:[...pan],target:e.target,curve:name,handle:h?+h.dataset.handle:null,original:name?{...params(name)}:null,c:name?curve(params(name)):null,dx:0,dy:0,moved:false};
 const vb=svg.viewBox.baseVal;frozenView=[vb.x,vb.y,vb.width,vb.height];svg.setPointerCapture(e.pointerId);if(name&&part!==name)showPart(name);
 if(drag.handle===1&&e.shiftKey)setHandle(name,1,0,0,drag.original,drag.c,true);e.preventDefault();};
svg.onpointermove=e=>{if(!drag)return;drag.moved||=Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>3;
 if(drag.handle!==null){const pt=world(e);drag.dx=pt.x-drag.point.x;drag.dy=drag.point.y-pt.y;setHandle(drag.curve,drag.handle,drag.dx,drag.dy,drag.original,drag.c,e.shiftKey);}
 else{const scale=frozenView[2]/svg.clientWidth,dx=(e.clientX-drag.x)*scale,dy=(e.clientY-drag.y)*scale;pan=[drag.pan[0]+dx,drag.pan[1]+dy];const vb=svg.viewBox.baseVal;svg.setAttribute('viewBox',`${frozenView[0]-dx} ${frozenView[1]-dy} ${vb.width} ${vb.height}`);}};
svg.onpointerup=e=>{if(!drag)return;if(!drag.moved&&drag.handle===null&&drag.target.dataset.index!==undefined){selected=+drag.target.dataset.index;const el=currentModel().elements[selected];if(el){$('#selected').textContent=describe(el);if(el.part!=='beam'&&part!==el.part)showPart(el.part);else if(el.part==='beam'&&part!=='beams')showPart('beams');}}
 const moved=drag.handle!==null;frozenView=null;drag=null;render();if(moved)scheduleSave();if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);};
svg.onpointercancel=()=>{drag=null;frozenView=null;render();};
for(const event of ['keydown','keyup'])document.addEventListener(event,e=>{if(e.key==='Shift'&&drag?.handle===1){e.preventDefault();setHandle(drag.curve,1,drag.dx,drag.dy,drag.original,drag.c,e.shiftKey);}});
svg.onkeydown=e=>{const h=e.target.closest('[data-handle]');if(!h||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const name=h.dataset.curve,i=+h.dataset.handle,d=e.shiftKey?1:.5,p={...params(name)};if(part!==name)showPart(name);setHandle(name,i,e.key==='ArrowLeft'?-d:e.key==='ArrowRight'?d:0,e.key==='ArrowUp'?d:e.key==='ArrowDown'?-d:0,p,curve(p));scheduleSave();};
svg.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(-e.deltaY*.001),.5,12);render();},{passive:false});
// ---- View, display and actions ----
function setView(value){mode3d=value;document.body.classList.toggle('mode3d',value);$('#preview').toggleAttribute('hidden',value);$('#preview3d').hidden=!value;$('#depth-control').hidden=!value;$('#camera-controls').hidden=!value;$('#view-2d').setAttribute('aria-pressed',String(!value));$('#view-3d').setAttribute('aria-pressed',String(value));$('#handles').disabled=value;$('#reference').disabled=value;$('#selected').textContent=value?'3D bridge · counts include depth':'2D elevation · counts for one layer';render();}
$('#view-2d').onclick=()=>{setView(false);scheduleSave();};$('#view-3d').onclick=()=>{setView(true);scheduleSave();};
$('#depth').oninput=e=>{if(e.target.value===''||!Number.isFinite(+e.target.value))return;depth=clamp(Math.round(+e.target.value),1,32);render();scheduleSave();};$('#depth').onchange=()=>$('#depth').value=depth;
for(const preset of ['outside','inside','top'])$('#'+preset).onclick=()=>three.preset(preset);
for(const id of ['reference','grid','handles'])$('#'+id).onchange=()=>{render();scheduleSave();};
$('#baseline').onchange=()=>{fits.lower.run();fits.upper.run();};
function setMono(on){mono=on;$('#mono').setAttribute('aria-pressed',String(mono));document.body.classList.toggle('mono',mono);}
$('#mono').onclick=()=>{setMono(!mono);render();scheduleSave();};
$('#plus').onclick=()=>{if(mode3d){three.zoom(1.3);return;}zoom=clamp(zoom*1.3,.5,12);render();};$('#minus').onclick=()=>{if(mode3d){three.zoom(1/1.3);return;}zoom=clamp(zoom/1.3,.5,12);render();};$('#fit').onclick=()=>{if(mode3d){three.fit();return;}zoom=1;pan=[0,0];render();};
$('#export').onclick=()=>{if(busy())return;const m=currentModel(),placed=mode3d?scene(m):placeRoof({blocks:m.elements},1),rows=['x,y,z,element,placement,full_half_direction,part'];
 for(const e of placed.blocks)rows.push(`${e.x},${e.y},${e.z},${['left','right'].includes(e.type)?'stair':e.type},${e.type==='block'?'full':e.type==='slab'?(e.flip?'top':'bottom'):(e.flip?'inverted':'upright')},${placementDirection(e)},${e.part==='beam'?e.beam+'-beam':e.part}`);
 const url=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download='minecraft-bridge-1.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
function mountAll(){mountCurve('lower');mountCurve('upper');mountUpperPlacement();mountBeams();}
$('#reset').onclick=()=>{state=bridgeDefaults();locks={lower:false,upper:false};zoom=1;pan=[0,0];frozenView=null;selected=-1;$('#baseline').checked=false;$('#selected').textContent='1 square = 1 block';mountAll();showPart('lower');fits.lower.run();fits.upper.run();};
new ResizeObserver(render).observe($('#viewport'));
// ---- State: autosave, blueprints ----
function scheduleSave(){if(!ready)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(storageKey,JSON.stringify(globalThis.bridge1State.capture()));}catch{}},400);}
globalThis.bridge1State={
 capture:()=>({lower:{...state.lower},upper:{params:{...state.upper.params},level:state.upper.level,mirrored:state.upper.mirrored},beams:{linked:state.beams.linked,left:{...state.beams.left},right:{...state.beams.right}},locks:{...locks},onlyBlocks:$('#baseline').checked,display:Object.fromEntries(['reference','grid','handles'].map(id=>[id,$('#'+id).checked])),mono,mode3d,depth,part,zoom,pan:[...pan],camera:three.getState()}),
 restore(input){const s=validateBridge1State(input);state={lower:{...s.lower},upper:{params:{...s.upper.params},level:s.upper.level,mirrored:s.upper.mirrored},beams:{linked:s.beams.linked,left:{...s.beams.left},right:{...s.beams.right}}};locks={...s.locks};depth=s.depth;zoom=s.zoom;pan=[...s.pan];drag=null;frozenView=null;selected=-1;sceneCache=null;
  $('#baseline').checked=s.onlyBlocks;for(const [id,v]of Object.entries(s.display))$('#'+id).checked=v;$('#depth').value=depth;setMono(s.mono);mountAll();showPart(s.part);setView(s.mode3d);three.setState(s.camera);fits.lower.run();fits.upper.run();}
};
mountAll();showPart('lower');fits.lower.run();fits.upper.run();
try{const saved=JSON.parse(localStorage.getItem(storageKey)??'null');if(saved)globalThis.bridge1State.restore(saved);}catch{}
ready=true;

})();</script></body></html>
