<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame designer</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;color:#e4ebe7;background:#000}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;grid-template-rows:auto minmax(0,1fr) auto}button,input{font:inherit;color:inherit;background:#1d2a21;border:1px solid #3b5040;border-radius:8px;min-height:44px;padding:8px}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #b9d9a5;outline-offset:2px}button[aria-pressed=true]{background:#a8c6a1;color:#17231a}#controls{display:flex;align-items:end;flex-wrap:wrap;gap:12px;padding:12px;border-bottom:1px solid #2c3732}label{display:grid;gap:5px;font-size:11px;color:#b7c7bb}input{width:90px;font-size:16px}label.active{color:#e8c98c}label.active input{border-color:#e8c98c}#actions{display:flex;gap:6px;margin-left:auto}#viewport{position:relative;min-height:0}canvas{width:100%;height:100%;position:absolute;touch-action:none;cursor:grab}#camera{position:absolute;top:12px;left:12px;display:flex;gap:6px}#zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}#zoom button{min-width:44px}footer{padding:9px 12px;border-top:1px solid #2c3732;display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#a6b8aa}#selection{position:absolute;bottom:16px;left:12px;font-size:11px;color:#c9d9cd;pointer-events:none;max-width:55%}@media(max-width:600px){#controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px}input{width:100%}#actions{grid-column:1/-1;margin:0;justify-content:flex-end}#actions button{font-size:12px}footer{font-size:10px}#camera button{font-size:12px}}@media(max-height:460px){#controls{display:flex;padding:6px}input{width:64px}#actions{margin-left:auto}label{font-size:10px}footer{padding:5px 12px}}
</style></head><body>
<div id="controls"><label id="inner-label">Inner pillars · 12<input id="inner-height" type="number" min="1" max="64" step="1" value="15" aria-label="Inner pillar height in blocks"></label><label id="outer-label">Outer pillars · 16<input id="outer-height" type="number" min="1" max="64" step="1" value="6" aria-label="Outer pillar height in blocks"></label><label>Base above ground<input id="elevation" type="number" min="0" max="64" step="1" value="20" aria-label="Base elevation in blocks"></label><div id="actions"><button id="reset-frame">Reset</button><button id="export-frame">Export CSV ↓</button></div></div>
<div id="viewport"><canvas id="frame-canvas" tabindex="0" aria-label="3D frame. Drag to orbit; tap a pillar to select its height group."></canvas><div id="camera"><button id="orbit">Perspective</button><button id="top-frame">Top</button></div><div id="zoom"><button id="minus-frame" aria-label="Zoom out">−</button><button id="fit-frame">Fit</button><button id="plus-frame" aria-label="Zoom in">+</button></div><span id="selection">Tap a pillar to select its group</span></div><footer><span>22 × 22 outer · 14 × 14 inner</span><span id="frame-count" role="status"></span></footer>
<script>(()=>{
// Only integer world positions and cardinal stair directions are used.
function placeRoof(roof,depth,layout='straight',run=null){
 const blocks=[];
 if(layout==='diagonal'){
  const bands=Math.max(2,Math.ceil(depth*Math.SQRT2));
  for(const e of roof.blocks)for(let t=e.x%2;t<bands;t+=2)blocks.push({...e,x:(e.x-t)/2,z:(e.x+t)/2,axis:'x',band:e.x});
 }else if(layout==='hip'){
  // Both wings use the complete edited profile. A half-span here silently
  // discarded the right endpoint and made the 3D design differ from the editor.
  const size=Math.max(1,Math.min(roof.columns.length,Math.ceil(run??roof.columns.length))),columns=new Map();for(const e of roof.blocks){if(!columns.has(e.x))columns.set(e.x,[]);columns.get(e.x).push(e);}
  for(let x=0;x<size;x++)for(let z=0;z<size;z++)for(const e of columns.get(Math.min(x,z))??[]){const seam=x===z,stair=e.type==='left'||e.type==='right';blocks.push({...e,x,z,axis:x<=z?'x':'z',...(seam&&stair?{type:'block',flip:false,seam:true}:{})});}
 }else for(let z=0;z<depth;z++)for(const e of roof.blocks)blocks.push({...e,z,axis:'x'});
 let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity,minZ=Infinity,maxZ=-Infinity;for(const e of blocks){minX=Math.min(minX,e.x);maxX=Math.max(maxX,e.x+1);minY=Math.min(minY,e.y);maxY=Math.max(maxY,e.y+1);minZ=Math.min(minZ,e.z);maxZ=Math.max(maxZ,e.z+1);}
 return {blocks,placed:true,layout,minX,maxX,minY,maxY,minZ,maxZ};
}
function occupiedVoxels(blocks){
 const voxels=new Map();blocks.forEach((e,id)=>{const mask=e.type==='block'?[1,1,1,1]:e.type==='slab'?[1,1,0,0]:e.type==='right'?[1,1,0,1]:[1,1,1,0];for(let a=0;a<2;a++)for(let y=0;y<2;y++)for(let b=0;b<2;b++){const side=e.axis==='z'?b:a,localY=e.flip?1-y:y;if(mask[localY*2+side])voxels.set(`${e.x*2+a},${e.y*2+y},${e.z*2+b}`,id);}});return voxels;
}
function placementDirection(e){return e.type==='left'||e.type==='right'?(e.type==='right'?'+':'-')+(e.axis==='z'?'Z':'X'):'';}

function roofMesh(blocks,depth=1,placed=false){
 const placements=placed?blocks:placeRoof({blocks},depth).blocks,voxels=occupiedVoxels(placements),groups=new Map(),faces=[];
 for(const [key,id]of voxels){const p=key.split(',').map(Number);for(let axis=0;axis<3;axis++)for(const sign of [-1,1]){const next=[...p];next[axis]+=sign;if(voxels.has(next.join(',')))continue;const plane=p[axis]+(sign>0?1:0),axes=[0,1,2].filter(a=>a!==axis),u=p[axes[0]],v=p[axes[1]],k=[id,axis,sign,plane].join(',');if(!groups.has(k))groups.set(k,{id,axis,sign,plane,axes,cells:new Set()});groups.get(k).cells.add(u+','+v);}}
 for(const g of groups.values())while(g.cells.size){const [u,v]=g.cells.values().next().value.split(',').map(Number);let w=1,h=1;while(g.cells.has((u+w)+','+v))w++;while(Array.from({length:w},(_,i)=>g.cells.has((u+i)+','+(v+h))).every(Boolean))h++;for(let i=0;i<w;i++)for(let j=0;j<h;j++)g.cells.delete((u+i)+','+(v+j));
 const pts=[[u,v],[u+w,v],[u+w,v+h],[u,v+h]].map(([a,b])=>{const p=[];p[g.axis]=g.plane/2;p[g.axes[0]]=a/2;p[g.axes[1]]=b/2;return p;}),normal=[0,0,0];normal[g.axis]=g.sign;faces.push({pts,normal,id:g.id,z:placements[g.id].z});}
 return faces;
}
function createRoof3D(canvas,onSelect){
 const ctx=canvas.getContext('2d');let yaw=-.62,pitch=.38,zoom=1,offset=[0,0],drag=null,roof,depth=12,mesh=[],options={},projected=[],frame;
 const colors={block:'#a5b691',slab:'#d3b981',left:'#6b8a66',right:'#6b8a66'};
 function draw(){if(!roof||canvas.hidden||!ctx)return;const rect=canvas.getBoundingClientRect(),w=rect.width,h=rect.height;if(!w||!h)return;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  const minX=roof.minX??0,maxX=roof.maxX??Math.max(...roof.blocks.map(b=>b.x+1)),minZ=roof.minZ??0,maxZ=roof.maxZ??depth,width=maxX-minX,cy=(Math.min(roof.minY,roof.groundY??roof.minY)+roof.maxY)/2,sy=Math.sin(yaw),co=Math.cos(yaw),sp=Math.sin(pitch),cp=Math.cos(pitch),radius=Math.hypot(width,roof.maxY-Math.min(roof.minY,roof.groundY??roof.minY),maxZ-minZ)/2,scale=Math.min(w,h)/(radius*2.35)*zoom;
  const camera=[sy*cp,sp,-co*cp];
  function project([x,y,z]){x-=(minX+maxX)/2;y-=cy;z-=(minZ+maxZ)/2;const xx=co*x+sy*z,zz=sy*x-co*z;return [w/2+offset[0]+xx*scale,h/2+offset[1]-(cp*y-sp*zz)*scale,cp*zz+sp*y];}
  function path(pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();}
  if(options.grid){ctx.strokeStyle='#304337';ctx.lineWidth=.7;const floor=roof.groundY??(roof.minY-1),pad=3,step=width>100?4:1;for(let x=minX-pad;x<=maxX+pad;x+=step){const a=project([x,floor,minZ-pad]),b=project([x,floor,maxZ+pad]);ctx.beginPath();ctx.moveTo(...a.slice(0,2));ctx.lineTo(...b.slice(0,2));ctx.stroke();}for(let z=minZ-pad;z<=maxZ+pad;z+=step){const a=project([minX-pad,floor,z]),b=project([maxX+pad,floor,z]);ctx.beginPath();ctx.moveTo(...a.slice(0,2));ctx.lineTo(...b.slice(0,2));ctx.stroke();}}
  projected=mesh.filter(f=>f.normal.reduce((s,n,i)=>s+n*camera[i],0)>.0001).map(f=>{const pts=f.pts.map(project);return {...f,pts,d:pts.reduce((s,p)=>s+p[2],0)/4};}).sort((a,b)=>a.d-b.d);
  ctx.globalAlpha=options.pending?.45:1;
  for(const face of projected){const e=roof.blocks[face.id],hex=options.selectedGroup&&e.group===options.selectedGroup?'#e8c98c':options.mono?'#9eaf8e':e.group==='outer'?'#88a9b6':colors[e.type],light=.72+.24*Math.max(0,face.normal[1])+.12*Math.max(0,-face.normal[2])+.07*Math.max(0,-face.normal[0]);const rgb=[1,3,5].map(i=>Math.round(parseInt(hex.slice(i,i+2),16)*light));path(face.pts);ctx.fillStyle=`rgb(${rgb})`;ctx.fill();ctx.strokeStyle='rgba(54,73,45,.27)';ctx.lineWidth=.55;ctx.stroke();}
  ctx.globalAlpha=1;
  canvas.dataset.faces=String(projected.length);canvas.dataset.depth=String(depth);canvas.dataset.yaw=String(yaw);canvas.dataset.pitch=String(pitch);
 }
 function schedule(){cancelAnimationFrame(frame);frame=requestAnimationFrame(draw);}
 canvas.oncontextmenu=e=>e.preventDefault();canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch,offset:[...offset],pan:e.shiftKey||e.button===2,moved:false};canvas.setPointerCapture(e.pointerId);e.preventDefault();};canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved||=Math.hypot(dx,dy)>3;if(drag.pan)offset=[drag.offset[0]+dx,drag.offset[1]+dy];else{yaw=drag.yaw+dx*.008;pitch=Math.max(-1.5,Math.min(1.5,drag.pitch+dy*.008));}schedule();};
 canvas.onpointerup=e=>{if(drag&&!drag.moved){const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;for(let i=projected.length-1;i>=0;i--){const f=projected[i];let inside=false;for(let j=0,k=f.pts.length-1;j<f.pts.length;k=j++){const a=f.pts[j],b=f.pts[k];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])inside=!inside;}if(inside){onSelect(roof.blocks[f.id],f.z);break;}}}drag=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);};canvas.onpointercancel=()=>drag=null;
 canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.3,Math.min(12,zoom*Math.exp(-e.deltaY*.001)));schedule();},{passive:false});canvas.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();yaw+=e.key==='ArrowLeft'?-.12:e.key==='ArrowRight'?.12:0;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.key==='ArrowUp'?.12:e.key==='ArrowDown'?-.12:0)));schedule();};
 return {update(r,d,o){if(r!==roof||d!==depth){roof=r;depth=d;mesh=r?roofMesh(r.blocks,d,!!r.placed):[];if(!r&&ctx)ctx.clearRect(0,0,canvas.width,canvas.height);}options=o;schedule();},zoom(factor){zoom=Math.max(.3,Math.min(12,zoom*factor));schedule();},fit(){zoom=1;offset=[0,0];schedule();},preset(name){yaw=name==='front'||name==='top'?0:-.62;pitch=name==='top'?Math.PI/2:name==='inside'?-.6:name==='front'?0:.38;zoom=1;offset=[0,0];schedule();}};
}



// All dimensions count occupied blocks, including the base perimeter layer.
function createFrame({innerHeight=15,outerHeight=6,elevation=20}={}){
 const integer=(v,min,max)=>Math.max(min,Math.min(max,Math.round(Number(v)||0)));
 innerHeight=integer(innerHeight,1,64);outerHeight=integer(outerHeight,1,64);elevation=integer(elevation,0,64);
 const inner=[],outer=[],positions=[4,8,13,17],seen=new Set();
 for(const t of positions)for(const [x,z]of [[t,4],[t,17],[4,t],[17,t]]){const key=x+','+z;if(!seen.has(key)){seen.add(key);inner.push([x,z]);}}
 for(const t of positions)outer.push([t,0],[t,21],[0,t],[21,t]);
 const cells=new Map();
 const add=(x,y,z,group,pillar=false)=>cells.set(`${x},${y},${z}`,{x,y,z,type:'block',axis:'x',group,pillar});
 for(const [lo,hi,group]of [[0,21,'outer'],[4,17,'inner']])for(let t=lo;t<=hi;t++)for(const [x,z]of [[t,lo],[t,hi],[lo,t],[hi,t]])add(x,elevation,z,group);
 for(const [pillars,height,group]of [[inner,innerHeight,'inner'],[outer,outerHeight,'outer']])for(const [x,z]of pillars)for(let y=elevation;y<elevation+height;y++)add(x,y,z,group,true);
 return {blocks:[...cells.values()],inner,outer,innerHeight,outerHeight,elevation,placed:true,minX:0,maxX:22,minZ:0,maxZ:22,minY:elevation,maxY:elevation+Math.max(innerHeight,outerHeight),groundY:0};
}

const el=id=>document.getElementById(id);
let frameModel,group=null;
const frameView=createRoof3D(el('frame-canvas'),block=>{
 group=block.group;el('selection').textContent=(group==='inner'?'12 inner':'16 outer')+' pillars selected';
 for(const g of ['inner','outer'])el(g+'-label').classList.toggle('active',g===group);
 updateFrame(false);el(group+'-height').focus({preventScroll:true});
});
function updateFrame(rebuild=true){
 if(rebuild)frameModel=createFrame({innerHeight:el('inner-height').value,outerHeight:el('outer-height').value,elevation:el('elevation').value});
 frameView.update(frameModel,22,{grid:true,selectedGroup:group});
 el('frame-count').textContent=frameModel.blocks.length+' blocks · base Y '+frameModel.elevation;
}
for(const id of ['inner-height','outer-height','elevation']){
 el(id).oninput=()=>{if(el(id).value!==''&&el(id).validity.valid)updateFrame();};
 el(id).onchange=()=>{const input=el(id);input.value=Math.max(+input.min,Math.min(+input.max,Math.round(+input.value)));updateFrame();};
}
el('reset-frame').onclick=()=>{el('inner-height').value=15;el('outer-height').value=6;el('elevation').value=20;group=null;for(const g of ['inner','outer'])el(g+'-label').classList.remove('active');el('selection').textContent='Tap a pillar to select its group';updateFrame();frameView.preset('outside');};
el('orbit').onclick=()=>frameView.preset('outside');el('top-frame').onclick=()=>frameView.preset('top');
el('minus-frame').onclick=()=>frameView.zoom(1/1.3);el('plus-frame').onclick=()=>frameView.zoom(1.3);el('fit-frame').onclick=()=>frameView.fit();
el('export-frame').onclick=()=>{const rows=['x,y,z,element,group',...frameModel.blocks.map(b=>`${b.x},${b.y},${b.z},block,${b.group}`)],url=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download='minecraft-frame.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
new ResizeObserver(()=>updateFrame(false)).observe(el('viewport'));updateFrame();

})();</script></body></html>
