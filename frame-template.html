<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame designer</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;color:#e4ebe7;background:#000}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;grid-template-rows:auto minmax(0,1fr) auto}button,input{font:inherit;color:inherit;background:#1d2a21;border:1px solid #3b5040;border-radius:8px;min-height:44px;padding:8px}button{cursor:pointer}button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid #b9d9a5;outline-offset:2px}button[aria-pressed=true]{background:#a8c6a1;color:#17231a}[hidden]{display:none!important}#tools{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid #2c3732}#actions{margin-left:auto;display:flex;gap:6px}main{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:0}aside{padding:16px;overflow-y:auto;border-right:1px solid #2c3732;background:#000}h2{font-size:14px;font-weight:500;margin:0 0 16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px 10px}label{display:grid;gap:6px;font-size:11px;color:#b7c7bb}input{width:100%;font-size:16px;min-width:0}label.active{color:#e8c98c}label.active input{border-color:#e8c98c}small{display:block;color:#97ab9d;font-size:11px;line-height:1.5;margin:12px 0}.check{display:flex;align-items:center;margin-bottom:14px;min-height:44px}.check input{width:18px;min-height:18px}#profile{width:100%;height:210px;border:1px solid #2c3732;border-radius:8px;touch-action:none;background:#080d09;margin-bottom:12px}#profile .handle{cursor:grab}#profile-lock{width:100%;margin-bottom:16px}#viewport{position:relative;min-height:0;min-width:0}canvas{width:100%;height:100%;position:absolute;touch-action:none;cursor:grab}#camera{position:absolute;top:12px;left:12px;display:flex;gap:6px}#zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}#zoom button{min-width:44px}footer{padding:9px 12px;border-top:1px solid #2c3732;display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#a6b8aa}#selection{position:absolute;bottom:16px;left:12px;font-size:11px;color:#c9d9cd;pointer-events:none;max-width:55%}#frame-status{position:absolute;top:66px;left:12px;right:12px;font-size:11px;color:#e8c98c;pointer-events:none}#close-controls{display:none}#sheet-shade{display:none}@media(max-width:760px){main{display:block;position:relative}#viewport{height:100%}aside{display:none;position:absolute;bottom:0;left:0;right:0;z-index:4;max-height:88%;border:1px solid #3b5040;border-radius:16px 16px 0 0;padding:14px}.editing aside{display:block}.editing #sheet-shade{display:block;position:absolute;inset:0;background:#0009;z-index:3;border:0;border-radius:0}#close-controls{display:block;float:right;min-height:38px;margin-bottom:10px}#profile{height:170px}.fields{gap:10px}#tools{padding:6px;gap:5px}#tools button{font-size:12px;padding:8px}#actions{gap:4px}footer{font-size:10px}#camera button{font-size:12px}}@media(max-height:500px){#tools{padding:4px}footer{padding:4px 12px}#profile{height:140px}}
</style></head><body>
<div id="tools"><button id="structure-tab" aria-pressed="true">Structure</button><button id="curves-tab" aria-pressed="false">Curves × 4</button><div id="actions"><button id="reset-frame">Reset</button><button id="export-frame">Export ↓</button></div></div>
<main><button id="sheet-shade" aria-label="Close editor"></button><aside id="controls"><button id="close-controls">Done</button>
<section id="structure-controls"><h2>Three concentric squares</h2><div class="fields"><label id="outer-label">Outer pillars · 16<input id="outer-height" type="number" min="1" max="64" step="1" value="6"></label><label id="inner-label">Middle pillars · 12<input id="inner-height" type="number" min="1" max="64" step="1" value="15"></label><label id="center-label">Centre pillars · 4<input id="center-height" type="number" min="1" max="64" step="1" value="20"></label><label>Base above ground<input id="elevation" type="number" min="0" max="64" step="1" value="20"></label></div><small>21 × 21 deck · 13 × 13 middle · 5 × 5 centre.<br>Pillar heights include the base block.</small></section>
<section id="curve-controls" hidden><h2>One profile, four sides</h2><label class="check"><input id="curves-enabled" type="checkbox" checked> Show curves</label><svg id="profile" tabindex="0" aria-label="Linked curve editor. Drag the middle and end handles; start is anchored to the centre platform."></svg><button id="profile-lock" aria-pressed="false">Lock bend to centre</button><div class="fields"><label>Reach (blocks)<input id="run" type="number" min="3" max="32" step="1" value="9"></label><label>End rise / fall<input id="end" type="number" min="-32" max="32" step=".5" value="-14"></label><label>Bend rise / fall<input id="middle" type="number" min="-32" max="32" step=".5" value="-3"></label><label>Bend position %<input id="bend" type="number" min="10" max="90" step="1" value="50"></label><label>Roof thickness<input id="thickness" type="number" min="1" max="4" step="1" value="2"></label></div><small>Start fixed to the centre platform. Drag the end to set reach and height. Shift centres the bend.</small></section>
</aside><div id="viewport"><canvas id="frame-canvas" tabindex="0" aria-label="3D frame. Drag to orbit; tap a pillar or curve to edit its group."></canvas><div id="camera"><button id="orbit">Perspective</button><button id="top-frame">Top</button></div><div id="frame-status" role="status"></div><div id="zoom"><button id="minus-frame" aria-label="Zoom out">−</button><button id="fit-frame">Fit</button><button id="plus-frame" aria-label="Zoom in">+</button></div><span id="selection">Tap a pillar or curve to edit</span></div></main><footer><span>21 × 21 · 13 × 13 · 5 × 5</span><span id="frame-count" role="status"></span></footer>
<script type="module" src="frame-app.js"></script></body></html>
