<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame designer</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;color:#e4ebe7;background:#000}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;grid-template-rows:auto minmax(0,1fr) auto}button,input{font:inherit;color:inherit;background:#1d2a21;border:1px solid #3b5040;border-radius:8px;min-height:44px;padding:8px}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #b9d9a5;outline-offset:2px}button[aria-pressed=true]{background:#a8c6a1;color:#17231a}#controls{display:flex;align-items:end;flex-wrap:wrap;gap:12px;padding:12px;border-bottom:1px solid #2c3732}label{display:grid;gap:5px;font-size:11px;color:#b7c7bb}input{width:90px;font-size:16px}label.active{color:#e8c98c}label.active input{border-color:#e8c98c}#actions{display:flex;gap:6px;margin-left:auto}#viewport{position:relative;min-height:0}canvas{width:100%;height:100%;position:absolute;touch-action:none;cursor:grab}#camera{position:absolute;top:12px;left:12px;display:flex;gap:6px}#zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}#zoom button{min-width:44px}footer{padding:9px 12px;border-top:1px solid #2c3732;display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#a6b8aa}#selection{position:absolute;bottom:16px;left:12px;font-size:11px;color:#c9d9cd;pointer-events:none;max-width:55%}@media(max-width:600px){#controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px}input{width:100%}#actions{grid-column:1/-1;margin:0;justify-content:flex-end}#actions button{font-size:12px}footer{font-size:10px}#camera button{font-size:12px}}@media(max-height:460px){#controls{display:flex;padding:6px}input{width:64px}#actions{margin-left:auto}label{font-size:10px}footer{padding:5px 12px}}
</style></head><body>
<div id="controls"><label id="inner-label">Inner pillars · 12<input id="inner-height" type="number" min="1" max="64" step="1" value="15" aria-label="Inner pillar height in blocks"></label><label id="outer-label">Outer pillars · 16<input id="outer-height" type="number" min="1" max="64" step="1" value="6" aria-label="Outer pillar height in blocks"></label><label>Base above ground<input id="elevation" type="number" min="0" max="64" step="1" value="20" aria-label="Base elevation in blocks"></label><div id="actions"><button id="reset-frame">Reset</button><button id="export-frame">Export CSV ↓</button></div></div>
<div id="viewport"><canvas id="frame-canvas" tabindex="0" aria-label="3D frame. Drag to orbit; tap a pillar to select its height group."></canvas><div id="camera"><button id="orbit">Perspective</button><button id="top-frame">Top</button></div><div id="zoom"><button id="minus-frame" aria-label="Zoom out">−</button><button id="fit-frame">Fit</button><button id="plus-frame" aria-label="Zoom in">+</button></div><span id="selection">Tap a pillar to select its group</span></div><footer><span>22 × 22 outer · 14 × 14 inner</span><span id="frame-count" role="status"></span></footer>
<script type="module" src="frame-app.js"></script></body></html>
