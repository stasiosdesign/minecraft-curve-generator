<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Minecraft Curve Generator</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="title-group"><button id="portrait-trigger" aria-label="View photo of Susan Boyle" title="Susan Boyle"><img src="assets/susan-boyle.png" alt="Susan Boyle"></button><strong>Curve generator</strong></div><div class="header-actions"><button id="adjust" aria-expanded="false" aria-controls="settings">Adjust</button><button id="reset">Reset</button><button id="export" disabled>Export ↓</button></div></header>
<main><button id="settings-backdrop" aria-label="Close settings" hidden></button><aside id="settings" aria-label="Curve settings"><div class="settings-heading"><strong>Shape &amp; settings</strong><button id="settings-done">Done</button></div><label class="field">Curve<select id="type"><option value="circle">Circular arc</option><option value="ellipse">Elliptical arc</option><option value="custom">Custom curve</option></select></label><label class="field layout-field">Layout<select id="layout"><option value="straight">Straight</option><option value="diagonal">45° diagonal</option><option value="hip">Corner / hip</option></select></label><div id="controls"></div><label class="field thickness" title="Vertical separation of the outside and inside reference curves">Roof thickness <span><input id="thickness" type="number" min="1" max="6" step=".5" value="2"> blocks</span></label><details class="display-settings"><summary>Display &amp; accuracy</summary><div class="options"><label><input id="reference" type="checkbox" checked> Reference curves</label><label><input id="grid" type="checkbox" checked> Grid</label><label><input id="handles" type="checkbox" checked> Curve handles</label><label><input id="baseline" type="checkbox"> Full blocks only</label></div><button id="mono" aria-pressed="false">Single colour</button><div class="errors" title="RMS nearest-curve error on horizontal surfaces; both boundaries and their vertical risers are optimised with equal weight."><span>Outside <b id="outer-error">—</b></span><span>Inside <b id="inner-error">—</b></span></div></details><button id="reset-mobile">Reset curve</button></aside>
<section class="canvas-panel"><div class="toolbar"><div class="view-switch"><button id="view-2d" aria-pressed="true">2D</button><button id="view-3d" aria-pressed="false">3D</button></div><label id="depth-control" hidden>Depth <input id="depth" type="number" min="1" max="32" value="12"> blocks</label><div id="camera-controls" hidden><button id="outside">Outside</button><button id="inside">Inside</button><button id="top">Top</button></div><span id="view-title">Roof / side elevation</span><div><button id="minus" aria-label="Zoom out">−</button><button id="fit">Fit</button><button id="plus" aria-label="Zoom in">+</button></div></div><div id="viewport"><svg id="preview" aria-label="Roof construction with editable reference curves"></svg><canvas id="preview3d" hidden tabindex="0" aria-label="Interactive 3D roof. Drag to orbit, shift-drag to pan, scroll to zoom. Arrow keys rotate."></canvas><div id="busy" role="status">Finding the best fit…</div><div id="drag-hint">Drag handles to shape · Drag grid to pan</div></div><div class="canvas-footer"><span id="selected">1 square = 1 block</span><span id="dimensions"></span></div></section></main>
<footer><div class="counts"><span><i class="swatch block"></i><b id="blocks">—</b> blocks</span><span><i class="swatch stair"></i><b id="stairs">—</b> stairs</span><span><i class="swatch slab"></i><b id="slabs">—</b> slabs</span></div><div class="reference-key"><span class="outer-key">— Outside</span><span class="inner-key">┄ Inside</span></div></footer><dialog id="portrait-dialog" aria-label="Susan Boyle photo"><button id="portrait-close" aria-label="Close photo">Close ×</button><img src="assets/susan-boyle.png" alt="Susan Boyle"></dialog><script type="module" src="app.js"></script></body></html>
